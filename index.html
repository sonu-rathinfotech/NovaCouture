<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VK Jewellers — a house catalogue of fine gold and stone work, shown by registered access."
    />
    <!-- Social preview. Curated-collection links are shared by WhatsApp, so
         the card needs a real title and image. The image URL becomes
         absolute once the site is hosted. Per-product previews need SSR or
         prerendering — out of scope for this SPA. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VK Jewellers" />
    <meta property="og:title" content="VK Jewellers — Private Catalogue" />
    <meta
      property="og:description"
      content="A private catalogue of fine gold and stone work, shown by registered access."
    />
    <meta property="og:image" content="/samples/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>VK Jewellers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
